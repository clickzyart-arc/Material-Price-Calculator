<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner Soft Inset Glow -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="6" />

  <!-- Calculator Main Card -->
  <g filter="url(#dropGlow)">
    <rect x="96" y="76" width="320" height="360" rx="36" fill="#0f172a" stroke="rgba(255,255,255,0.15)" stroke-width="4" />

    <!-- Screen / Digital Display -->
    <rect x="126" y="106" width="260" height="74" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <!-- Display Digits (Symbolic Rate) -->
    <text x="366" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="700" fill="#38bdf8" text-anchor="end">₹ 1,840</text>
    <circle cx="146" cy="143" r="6" fill="#10b981" />

    <!-- Keypad Grid -->
    <!-- Row 1 -->
    <rect x="126" y="200" width="54" height="46" rx="10" fill="#334155" />
    <text x="153" y="232" font-family="sans-serif" font-size="20" font-weight="600" fill="#f8fafc" text-anchor="middle">C</text>

    <rect x="194" y="200" width="54" height="46" rx="10" fill="#334155" />
    <text x="221" y="232" font-family="sans-serif" font-size="20" font-weight="600" fill="#f8fafc" text-anchor="middle">&plusmn;</text>

    <rect x="262" y="200" width="54" height="46" rx="10" fill="#334155" />
    <text x="289" y="232" font-family="sans-serif" font-size="20" font-weight="600" fill="#f8fafc" text-anchor="middle">%</text>

    <rect x="332" y="200" width="54" height="46" rx="10" fill="url(#accentGrad)" />
    <text x="359" y="232" font-family="sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">&divide;</text>

    <!-- Row 2 -->
    <rect x="126" y="256" width="54" height="46" rx="10" fill="#1e293b" />
    <text x="153" y="288" font-family="sans-serif" font-size="20" font-weight="600" fill="#e2e8f0" text-anchor="middle">7</text>

    <rect x="194" y="256" width="54" height="46" rx="10" fill="#1e293b" />
    <text x="221" y="288" font-family="sans-serif" font-size="20" font-weight="600" fill="#e2e8f0" text-anchor="middle">8</text>

    <rect x="262" y="256" width="54" height="46" rx="10" fill="#1e293b" />
    <text x="289" y="288" font-family="sans-serif" font-size="20" font-weight="600" fill="#e2e8f0" text-anchor="middle">9</text>

    <rect x="332" y="256" width="54" height="46" rx="10" fill="url(#accentGrad)" />
    <text x="359" y="288" font-family="sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">&times;</text>

    <!-- Row 3 -->
    <rect x="126" y="312" width="54" height="46" rx="10" fill="#1e293b" />
    <text x="153" y="344" font-family="sans-serif" font-size="20" font-weight="600" fill="#e2e8f0" text-anchor="middle">4</text>

    <rect x="194" y="312" width="54" height="46" rx="10" fill="#1e293b" />
    <text x="221" y="344" font-family="sans-serif" font-size="20" font-weight="600" fill="#e2e8f0" text-anchor="middle">5</text>

    <rect x="262" y="312" width="54" height="46" rx="10" fill="#1e293b" />
    <text x="289" y="344" font-family="sans-serif" font-size="20" font-weight="600" fill="#e2e8f0" text-anchor="middle">6</text>

    <rect x="332" y="312" width="54" height="46" rx="10" fill="url(#accentGrad)" />
    <text x="359" y="344" font-family="sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">&minus;</text>

    <!-- Row 4 -->
    <rect x="126" y="368" width="54" height="46" rx="10" fill="#1e293b" />
    <text x="153" y="400" font-family="sans-serif" font-size="20" font-weight="600" fill="#e2e8f0" text-anchor="middle">1</text>

    <rect x="194" y="368" width="54" height="46" rx="10" fill="#1e293b" />
    <text x="221" y="400" font-family="sans-serif" font-size="20" font-weight="600" fill="#e2e8f0" text-anchor="middle">2</text>

    <rect x="262" y="368" width="54" height="46" rx="10" fill="#1e293b" />
    <text x="289" y="400" font-family="sans-serif" font-size="20" font-weight="600" fill="#e2e8f0" text-anchor="middle">3</text>

    <rect x="332" y="368" width="54" height="46" rx="10" fill="#10b981" />
    <text x="359" y="400" font-family="sans-serif" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">=</text>
  </g>

  <!-- Subtle corner badge indicating offline sync -->
  <circle cx="430" cy="80" r="32" fill="#10b981" stroke="#ffffff" stroke-width="4" />
  <path d="M418 80 L426 88 L444 70" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
